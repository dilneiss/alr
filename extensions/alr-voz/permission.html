<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autorizar Microfone - ALR Voz</title>
  <style>
    :root {
      --bg: #0b111a;
      --card-bg: #101926;
      --border: #1e2c3f;
      --orange: #f97316;
      --orange-hover: #ea580c;
      --green: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }
    .auth-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      object-fit: contain;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .btn-allow {
      background: linear-gradient(135deg, #ff6b35 0%, #f97316 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 18px rgba(249, 115, 22, 0.45);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-allow:hover {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      transform: translateY(-1px);
    }
    .status-msg {
      font-size: 12px;
      min-height: 20px;
      color: var(--orange);
      font-weight: 600;
    }
    .status-msg.success {
      color: var(--green);
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <img src="icons/alr-logo.png" alt="ALR Logo" class="auth-logo">
    <h1>Permissão de Microfone do ALR Voz</h1>
    <p>Para controlar o navegador por voz, o Chrome precisa da sua autorização para acessar o microfone na extensão.</p>
    
    <button class="btn-allow" id="btn-request-permission">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
      <span>Permitir Microfone</span>
    </button>

    <div class="status-msg" id="status-msg">Clique no botão acima e selecione "Permitir".</div>
  </div>

  <script src="permission.js"></script>
</body>
</html>
