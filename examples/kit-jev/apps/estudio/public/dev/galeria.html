<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria de peças · Estúdio por Voz</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/carrossel.css">
<link rel="stylesheet" href="../css/email.css">
<link rel="stylesheet" href="../css/anuncios.css">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0d14; color: #e8e8ec; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header.g { position: sticky; top: 0; z-index: 10; padding: 10px 16px; background: #0b0d14ee; border-bottom: 1px solid #ffffff18; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  header.g a { color: #a5f3fc; text-decoration: none; } header.g b { color: #fff; }
  main.g { padding: 16px; display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
  .g-item { display: flex; flex-direction: column; gap: 6px; }
  .g-rot { font: 600 12px/1.35 ui-monospace, Menlo, monospace; color: #9ca3af; max-width: 100%; }
  .g-rot b { color: #fde68a; }
  /* moldura com o tamanho REAL do painel no estúdio (1440×900) */
  .g-caixa { position: relative; background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012)); border: 1px solid #ffffff1c; border-radius: 18px; padding: 8px 10px 10px; overflow: hidden; }
  .g-caixa.ampliado { border-radius: 10px; padding: 0; background: #0e1018; }
</style>
</head>
<body>
<header class="g" id="topo"></header>
<main class="g" id="galeria"></main>
<script type="module" src="galeria.mjs"></script>
</body>
</html>
