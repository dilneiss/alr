services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: alr-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true
      - QDRANT__LOG_LEVEL=INFO

volumes:
  qdrant_storage:
    driver: local
