[workspace]
resolver = "2"
members = [
    "crates/alr-core",
    "crates/alr-memory",
    "crates/alr-learning",
    "crates/alr-llm",
    "crates/alr-perception",
    "crates/alr-execution",
    "crates/alr-snake",
    "crates/alr-agent",
    "crates/alr-browser",
    "crates/alr-connectors",
    "crates/alr-models",
    "crates/alr-world",
    "crates/alr-spatial",
    "crates/alr-environment",
    "crates/alr-transfer",
    "crates/alr-improvement",
    "crates/alr-mcp",
    "crates/alr-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ALR Core Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
alr-core = { path = "crates/alr-core" }
alr-memory = { path = "crates/alr-memory" }
alr-learning = { path = "crates/alr-learning" }
alr-llm = { path = "crates/alr-llm" }
alr-perception = { path = "crates/alr-perception" }
alr-execution = { path = "crates/alr-execution" }
alr-snake = { path = "crates/alr-snake" }
alr-agent = { path = "crates/alr-agent" }
alr-browser = { path = "crates/alr-browser" }
alr-connectors = { path = "crates/alr-connectors" }
alr-models = { path = "crates/alr-models" }
alr-world = { path = "crates/alr-world" }
alr-spatial = { path = "crates/alr-spatial" }
alr-environment = { path = "crates/alr-environment" }
alr-transfer = { path = "crates/alr-transfer" }
alr-improvement = { path = "crates/alr-improvement" }
alr-mcp = { path = "crates/alr-mcp" }
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
async-trait = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
nrand = { package = "rand", version = "0.8" }
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["json"] }
image = "0.25"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
axum = { version = "0.7", features = ["json"] }
